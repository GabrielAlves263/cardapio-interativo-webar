<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu AR - Experience</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <script type="module" src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs"></script>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="product-details" class="details-layer hidden">
    <div class="glass-panel product-card">
      <div class="card-header">
        <h2 id="p-title">Nome do Prato</h2>
        <span id="p-price" class="price-tag">R$ 00,00</span>
      </div>
      <p id="p-desc">Descrição do produto.</p>
      
      <button id="btn-place" class="action-btn">
        <span class="material-symbols-outlined">view_in_ar</span>
        Ver na Mesa (Tamanho Real)
      </button>
    </div>
  </div>

  <div id="ui-container" class="fab-layer hidden">
    <div class="fab-container">
      <div class="filter-group" id="fab-options">
        <button class="filter-btn" data-type="lactose">🥛 Sem Lactose</button>
        <button class="filter-btn" data-type="gluten">🌾 Sem Glúten</button>
        <button class="filter-btn" data-type="vegan">🌱 Vegano</button>
      </div>
      <button class="fab-main" id="fab-trigger" aria-label="Abrir Filtros">
        <span class="material-symbols-outlined" id="fab-icon">filter_alt</span>
      </button>
    </div>
  </div>

  <div id="scan-guide" class="scan-overlay">
    <div class="scan-content">
      <dotlottie-player src="assets/ui/scan.lottie" background="transparent" speed="1"
        style="width: 250px; height: 250px; opacity: 0.8;" loop autoplay>
      </dotlottie-player>
      <p style="color: white; margin-top: -20px; font-weight: 500;">Aponte para o cardápio</p>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./target/menu-target-3.mind; uiScanning: #scan-guide;" 
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="model-breakfast" src="assets/food/breakfest-4.glb"></a-asset-item>
      <a-asset-item id="model-cake" src="assets/food/cake-2.glb"></a-asset-item>
      <a-asset-item id="model-chicken" src="assets/food/chicken-fries-2.glb"></a-asset-item>
      <a-asset-item id="model-pizza" src="assets/food/pizza-2.glb"></a-asset-item>
      <a-asset-item id="model-sandwich" src="assets/food/sandwich.glb"></a-asset-item>
      <a-asset-item id="model-snacks" src="assets/food/snacks-2.glb"></a-asset-item>
      <img id="tex-frame-safe" src="assets/ui/item-frame.png">
      <img id="tex-frame-blocked" src="assets/ui/item-frame-blocked.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse:false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      
      <a-entity position="2 0.9 0">
        <a-plane id="menu-1" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 0 0"></a-plane>
        <a-plane id="menu-2" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 -0.3 0"></a-plane>
        <a-plane id="menu-3" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 -1 0"></a-plane>
        <a-plane id="menu-4" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 -1.3 0"></a-plane>
        <a-plane id="menu-5" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 -1.6 0"></a-plane>
        <a-plane id="menu-6" class="clickable" color="white" opacity="0" height="0.3" width="2.5" position="0 -2.3 0"></a-plane>
      </a-entity>
      
      <!-- <a-entity id="models-container" position="-0.5 -1 0" rotation="90 0 0"></a-entity> -->
    
    </a-entity>

  </a-scene>

  <script src="js/script.js"></script>
</body>
</html>
