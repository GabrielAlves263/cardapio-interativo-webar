<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js AR Hit Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        /* O botão AR será injetado automaticamente pelo ARButton */
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // Declaração de variáveis globais
    let container;
    let camera, scene, renderer;
    let controller;
    
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    init();
    animate();

    function init() {
        container = document.createElement('div');
        document.body.appendChild(container);

        // 1. Configuração da Cena
        scene = new THREE.Scene();

        // 2. Configuração da Câmera (O WebXR vai sobrescrever isso, mas é necessário iniciar)
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        // 3. Iluminação
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        // 4. Configuração do Renderizador
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Habilita WebXR no renderizador
        container.appendChild(renderer.domElement);

        // 5. Botão AR (Gerencia a sessão e os requiredFeatures)
        // Isso cria automaticamente o botão "Start AR" na tela
        document.body.appendChild(ARButton.createButton(renderer, { 
            requiredFeatures: ['hit-test'] 
        }));

        // 6. Geometria do Cubo Vermelho (será clonado ao clicar)
        const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1); // 10cm
        const material = new THREE.MeshPhongMaterial({ color: 0xff0000 });

        // Função chamada ao tocar na tela
        function onSelect() {
            if (reticle.visible) {
                // Cria um novo cubo
                const mesh = new THREE.Mesh(geometry, material);
                
                // Posiciona o cubo onde o retículo está
                // setFromMatrixPosition extrai a posição (x,y,z) da matriz do retículo
                mesh.position.setFromMatrixPosition(reticle.matrix);
                
                scene.add(mesh);
            }
        }

        // 7. Controle (Input do WebXR)
        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        // 8. O Retículo (Cursor)
        // Um anel simples
        reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial()
        );
        reticle.matrixAutoUpdate = false; // Nós atualizaremos a matriz manualmente com o hit-test
        reticle.visible = false; // Começa invisível
        scene.add(reticle);

        // Ajuste de redimensionamento da tela
        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        renderer.setAnimationLoop(render);
    }

    // O loop de renderização (chamado a cada frame)
    function render(timestamp, frame) {
        if (frame) {
            // Lógica para solicitar o Hit Test Source apenas uma vez
            const referenceSpace = renderer.xr.getReferenceSpace();
            const session = renderer.xr.getSession();

            if (hitTestSourceRequested === false) {
                session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                    session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                        hitTestSource = source;
                    });
                });

                // Evento para limpar quando a sessão acabar
                session.addEventListener('end', function () {
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });

                hitTestSourceRequested = true;
            }

            // Lógica principal do Hit Test
            if (hitTestSource) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);

                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];

                    // Torna o retículo visível
                    reticle.visible = true;
                    
                    // Atualiza a posição do retículo baseado no ponto de colisão no mundo real
                    reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                } else {
                    reticle.visible = false;
                }
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
